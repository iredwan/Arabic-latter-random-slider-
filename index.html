<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আরবি ২৯ হরফ ভিউয়ার</title>
    <style>
        @font-face {
            font-family: 'IqraArabicFont';
            src: url('../assets/fonts/CustomFont.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212;
            overflow: hidden;
            font-family: 'IqraArabicFont', sans-serif;
            user-select: none;
            touch-action: pan-y;
        }

        #letter-display {
            font-size: 45vh;
            font-weight: bold;
            text-align: center;
            line-height: 1;
            transition: transform 0.25s ease-out, opacity 0.25s ease-out;
            will-change: transform, opacity;
        }

        /* স্লাইড অ্যানিমেশন ক্লাস */
        .slide-from-right {
            animation: slideInFromRight 0.3s forwards ease-out;
        }

        .slide-from-left {
            animation: slideInFromLeft 0.3s forwards ease-out;
        }

        @keyframes slideInFromRight {
            0% {
                transform: translateX(100vw);
                opacity: 0;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideInFromLeft {
            0% {
                transform: translateX(-100vw);
                opacity: 0;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <div id="letter-display"></div>

    <script>
        // আপনার দেওয়া কালার কোড অনুযায়ী নিখুঁত ২৯টি আরবি হরফ
        const colorGroups = [
            {
                color: '#4cb648',
                letters: ['ج', 'ذ', 'ض', 'ص', 'ن', 'م', 'غ', 'ع', 'و', 'ش', 'س', 'د', 'ل', 'ك', 'ق']
            },
            {
                color: '#60c9e6',
                letters: ['ث', 'ت', 'ر', 'ه', 'خ', 'ظ', 'ي', 'ط', 'ف', 'ز', 'ب', 'ح']
            },
            {
                color: '#ec1a4c',
                letters: ['ء', 'ا']
            }
        ];

        // ২৯টি হরফ এক জায়গায় সংগ্রহ করা
        const baseLetters = [];
        colorGroups.forEach(group => {
            group.letters.forEach(char => {
                baseLetters.push({ char: char, color: group.color });
            });
        });

        // Fisher-Yates Shuffle অ্যালগরিদম দিয়ে ২৯টি হরফকে এলোমেলো করা
        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // স্টেট ট্র্যাকিং
        let currentPool = shuffleArray(baseLetters); // বর্তমান ২৯ হরফের র্যান্ডম пул
        let historyStack = [];
        let currentIndex = -1;

        const displayDiv = document.getElementById('letter-display');

        // ডান থেকে বামে স্লাইড (নতুন হরফ আসবে)
        function showNextLetter() {
            if (currentIndex < historyStack.length - 1) {
                // পূর্বে দেখা হিস্ট্রিতে সামনে যাওয়া
                currentIndex++;
                renderLetter(historyStack[currentIndex], 'right');
            } else {
                // ২৯টি হরফ শেষ হয়ে গেলে নতুন একটি র্যান্ডম রাউন্ড শুরু হবে
                if (currentPool.length === 0) {
                    currentPool = shuffleArray(baseLetters);
                }

                // একটি হরফ পুল থেকে নিয়ে দেখানো (যাতে এটি পুনরাবৃত্তি না হয়)
                const nextLetter = currentPool.pop();
                historyStack.push(nextLetter);
                currentIndex++;
                renderLetter(nextLetter, 'right');
            }
        }

        // বাম থেকে ডানে স্লাইড (হিস্ট্রি বা আগের হরফে ফেরত)
        function showPreviousLetter() {
            if (currentIndex > 0) {
                currentIndex--;
                renderLetter(historyStack[currentIndex], 'left');
            }
        }

        function renderLetter(item, direction) {
            displayDiv.classList.remove('slide-from-right', 'slide-from-left');
            void displayDiv.offsetWidth; // DOM Reflow Trigger

            displayDiv.textContent = item.char;
            displayDiv.style.color = item.color;

            if (direction === 'right') {
                displayDiv.classList.add('slide-from-right');
            } else if (direction === 'left') {
                displayDiv.classList.add('slide-from-left');
            }
        }

        // অ্যাপ চালু করার সময় প্রথম হরফ দিয়ে শুরু
        showNextLetter();

        // ---------------- Touch Swipe Logic ----------------
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, false);

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, false);

        function handleSwipe() {
            const swipeDistance = touchEndX - touchStartX;
            const threshold = 50; 

            if (swipeDistance < -threshold) {
                showNextLetter(); // ডান থেকে বামে সোয়াইপ (নতুন হরফ)
            } else if (swipeDistance > threshold) {
                showPreviousLetter(); // বাম থেকে ডানে সোয়াইপ (আগের ইতিহাস)
            }
        }

        // ---------------- Keyboard Arrow Keys Logic ----------------
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') { 
                showNextLetter();
            } else if (e.key === 'ArrowRight') { 
                showPreviousLetter();
            }
        });
    </script>
</body>
</html>
